<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc"><title id="title">The scored knee MRI ensemble and its separate experimental branch</title><desc id="desc">MRI studies feed R7, Raptor384 and Raptor224, then percentile ranks and a weighted blend produce twelve scores. The experimental ConvNeXt branch was evaluated separately and rejected.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#78d6cf"/></marker></defs><rect width="1600" height="840" fill="#081c2b"/><g font-family="Arial, sans-serif" fill="#edf5f3"><text x="65" y="75" font-size="37" font-weight="bold">From a knee MRI study to twelve finding scores</text><text x="65" y="115" font-size="22" fill="#b5cbd2">Scored ensemble: public pretrained models + notebook integration</text><rect x="65" y="275" width="270" height="110" rx="18" fill="#102e40" stroke="#78d6cf" stroke-width="2"/><text x="200.0" y="313" text-anchor="middle" font-size="24">Knee MRI study</text><text x="200.0" y="344" text-anchor="middle" font-size="20">DICOM series / slices</text><rect x="450" y="165" width="300" height="108" rx="18" fill="#102e40" stroke="#78d6cf" stroke-width="2"/><text x="600.0" y="203" text-anchor="middle" font-size="24">R7 ensemble</text><text x="600.0" y="234" text-anchor="middle" font-size="20">Nominal share: 50.0%</text><path d="M335,330 L450,219" stroke="#78d6cf" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M750,219 L865,330" stroke="#78d6cf" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="450" y="305" width="300" height="108" rx="18" fill="#102e40" stroke="#78d6cf" stroke-width="2"/><text x="600.0" y="343" text-anchor="middle" font-size="24">Raptor384</text><text x="600.0" y="374" text-anchor="middle" font-size="20">Nominal share: 32.5%</text><path d="M335,330 L450,359" stroke="#78d6cf" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M750,359 L865,330" stroke="#78d6cf" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="450" y="445" width="300" height="108" rx="18" fill="#102e40" stroke="#78d6cf" stroke-width="2"/><text x="600.0" y="483" text-anchor="middle" font-size="24">Raptor224</text><text x="600.0" y="514" text-anchor="middle" font-size="20">Nominal share: 17.5%</text><path d="M335,330 L450,499" stroke="#78d6cf" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M750,499 L865,330" stroke="#78d6cf" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="865" y="270" width="290" height="120" rx="18" fill="#102e40" stroke="#78d6cf" stroke-width="2"/><text x="1010.0" y="308" text-anchor="middle" font-size="24">Percentile ranks</text><text x="1010.0" y="339" text-anchor="middle" font-size="20">Weighted rank blend</text><path d="M1155,330 L1240,330" stroke="#78d6cf" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="1240" y="270" width="295" height="120" rx="18" fill="#102e40" stroke="#78d6cf" stroke-width="2"/><text x="1387.5" y="308" text-anchor="middle" font-size="24">12 finding scores</text><text x="1387.5" y="339" text-anchor="middle" font-size="20">submission.csv</text><text x="65" y="610" font-size="21" fill="#b5cbd2">Shares shown for complete model coverage. Failure handling is logged separately.</text><rect x="65" y="655" width="650" height="105" rx="18" fill="#102e40" stroke="#dfa66f" stroke-width="2"/><text x="390.0" y="693" text-anchor="middle" font-size="24">Separate ConvNeXt experiment</text><text x="390.0" y="724" text-anchor="middle" font-size="20">Three folds · 11 findings · pseudo-target training</text><rect x="865" y="655" width="670" height="105" rx="18" fill="#102e40" stroke="#dfa66f" stroke-width="2"/><text x="1200.0" y="693" text-anchor="middle" font-size="24">5% candidate contribution rejected</text><text x="1200.0" y="724" text-anchor="middle" font-size="20">Expert-panel comparison did not support a gain</text><path d="M715,708 L865,708" stroke="#78d6cf" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="65" y="809" font-size="19" fill="#b5cbd2">TerminalBio • Project schematic; no patient images or diagnostic localization shown.</text></g></svg>